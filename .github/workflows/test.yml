name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  # The server imports its SDK with a 1.x fallback (server.py, errors.py). Hold that fallback
  # to a real 1.x install, so an import or an error path that only works on 2.x fails here.
  pytest-mcp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras, on mcp 1.x
        run: pip install -e ".[dev]" "mcp<2"
      - name: Run tests
        run: pytest
